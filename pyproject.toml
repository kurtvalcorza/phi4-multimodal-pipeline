[project]
name = "phi4-multimodal-pipeline"
version = "0.1.0"
description = "DIMER inference pipeline for Microsoft Phi-4-multimodal-instruct"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kurt Valcorza" }]
dependencies = [
  "torch==2.6.0", "torchvision==0.21.0", "transformers==4.48.2", "accelerate==1.3.0",
  "soundfile==0.13.1", "pillow==11.1.0", "scipy==1.15.2", "backoff==2.2.1", "peft==0.13.2"
]
[project.optional-dependencies]
tutorial = ["datasets==4.4.0"]
dev = ["pytest==9.0.2", "ruff==0.12.10", "numpy==1.26.4"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/phi4_multimodal_pipeline"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
